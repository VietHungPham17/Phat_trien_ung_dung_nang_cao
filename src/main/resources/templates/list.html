<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/sidebar :: head(title=${pageTitle})}"></head>
<body>

<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <div class="main-area">
        <header th:replace="~{fragments/topbar :: topbar}"></header>
        <main class="main-content">
            <div class="page-header">
                <h1 th:text="${pageTitle}">Tiêu đề trang</h1>
                <div class="actions-bar">
                    <button type="button" class="btn btn-primary">
                        <span aria-hidden="true">+</span>
                        <span>Thêm mới</span>
                    </button>
                    <button type="button" class="btn btn-outline">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        <span>Xuất file</span>
                        <span aria-hidden="true">▾</span>
                    </button>
                </div>
            </div>

            <div class="search-bar">
                <div class="search-input-wrap">
                    <input type="text" class="search-input"
                           th:placeholder="'Tìm kiếm theo tên niên khóa, mô tả, năm...'"/>
                </div>
                <button type="button" class="btn btn-outline">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
                    <span>Tìm kiếm nâng cao</span>
                    <span aria-hidden="true">▾</span>
                </button>
            </div>

            <div class="table-card">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th th:each="col,iter : ${menuItem.columns()}"
                                th:classappend="${iter.last} ? 'text-center' : ''"
                                th:text="${col.header()}">COLUMN</th>
                            <th class="text-center" th:if="${not #lists.isEmpty(menuItem.columns())}">THAO TÁC</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(items)}">
                            <td colspan="100" class="row-empty">
                                <div>Chưa có dữ liệu.</div>
                                <p>Bấm <strong>Thêm mới</strong> để tạo bản ghi đầu tiên.</p>
                            </td>
                        </tr>
                        <tr th:each="row,rowIter : ${items}">
                            <td th:each="col,iter : ${menuItem.columns()}"
                                th:classappend="${iter.last} ? 'text-center' : ''">
                                <span th:if="${col.key() == 'tt'}" th:text="${rowIter.count}">1</span>
                                <span th:if="${col.key() != 'tt'}"
                                      th:text="${T(com.example.schoolapi.view.BeanField).read(row, col.key())} ?: '—'">—</span>
                            </td>
                            <td class="text-center">
                                <button type="button" class="btn btn-icon" title="Chỉnh sửa">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                                    <span>Chỉnh sửa</span>
                                </button>
                                <button type="button" class="btn btn-icon btn-icon-danger" title="Xóa">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div class="table-footer">
                    <div>
                        <span th:if="${not #lists.isEmpty(items)}">
                            <span th:text="'1–' + ${#lists.size(items)} + ' trong số ' + ${#lists.size(items)}">1–8 trong số 8</span>
                        </span>
                        <span th:if="${#lists.isEmpty(items)}">0 trong số 0</span>
                    </div>
                    <div class="pagination">
                        <button type="button" disabled>‹</button>
                        <button type="button" class="active">1</button>
                        <button type="button" disabled>›</button>
                    </div>
                    <div class="page-size">
                        <span>10 / trang</span>
                        <span aria-hidden="true">▾</span>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

</body>
</html>
