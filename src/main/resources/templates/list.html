<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/sidebar :: head(title=${pageTitle})}"></head>
<body>

<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <div class="main-area">
        <header th:replace="~{fragments/topbar :: topbar}"></header>
        <main class="main-content">
            <div class="page-header">
                <h1 th:text="${pageTitle}">Tiêu đề trang</h1>
                <div class="actions-bar">
                    <button type="button" class="btn btn-primary">
                        <span aria-hidden="true">＋</span>
                        <span>Thêm mới</span>
                    </button>
                    <button type="button" class="btn btn-outline">
                        <span aria-hidden="true">↓</span>
                        <span>Xuất file</span>
                    </button>
                </div>
            </div>

            <div class="search-bar">
                <div class="search-input-wrap">
                    <input type="text" class="search-input"
                           th:placeholder="'Tìm kiếm theo ' + ${#strings.toLowerCase(pageTitle)} + '...'"/>
                </div>
                <button type="button" class="btn btn-outline">
                    <span>Tìm kiếm nâng cao</span>
                    <span aria-hidden="true">▾</span>
                </button>
            </div>

            <div class="table-card">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th th:each="col,iter : ${menuItem.columns()}"
                                th:classappend="${iter.last} ? 'text-center' : ''"
                                th:text="${col.header()}">COLUMN</th>
                            <th class="text-center" th:if="${not #lists.isEmpty(menuItem.columns())}">THAO TÁC</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(items)}">
                            <td colspan="100" class="row-empty">
                                <div>Chưa có dữ liệu.</div>
                                <p>Bấm <strong>Thêm mới</strong> để tạo bản ghi đầu tiên.</p>
                            </td>
                        </tr>
                        <tr th:each="row,rowIter : ${items}">
                            <td th:each="col,iter : ${menuItem.columns()}"
                                th:classappend="${iter.last} ? 'text-center' : ''">
                                <span th:if="${col.key() == 'tt'}" th:text="${rowIter.count}">1</span>
                                <span th:if="${col.key() != 'tt'}"
                                      th:text="${T(com.example.schoolapi.view.BeanField).read(row, col.key())} ?: '—'">—</span>
                            </td>
                            <td class="text-center">
                                <button type="button" class="btn btn-icon" title="Chỉnh sửa">
                                    <span aria-hidden="true">✎</span>
                                    <span>Chỉnh sửa</span>
                                </button>
                                <button type="button" class="btn btn-icon btn-icon-danger" title="Xóa">
                                    <span aria-hidden="true">🗑</span>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div class="table-footer">
                    <div>
                        <span th:if="${not #lists.isEmpty(items)}">
                            <span th:text="'1–' + ${#lists.size(items)} + ' trong số ' + ${#lists.size(items)}">1–8 trong số 8</span>
                        </span>
                        <span th:if="${#lists.isEmpty(items)}">0 trong số 0</span>
                    </div>
                    <div class="pagination">
                        <button type="button" disabled>‹</button>
                        <button type="button" class="active">1</button>
                        <button type="button" disabled>›</button>
                    </div>
                    <div class="page-size">
                        <span>10 / trang</span>
                        <span aria-hidden="true">▾</span>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

</body>
</html>
