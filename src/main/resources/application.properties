spring.application.name=school-api

# --- MySQL ---
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/school_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=school_app
# Password comes from the SCHOOL_DB_PASSWORD environment variable - never hardcoded here.
spring.datasource.password=${SCHOOL_DB_PASSWORD}

# --- JPA / Hibernate ---
# "update" auto-creates and evolves tables from entities on startup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Server ---
server.port=${SERVER_PORT:8080}

# --- Thymeleaf ---
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
