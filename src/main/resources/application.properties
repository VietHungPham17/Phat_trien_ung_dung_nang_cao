spring.application.name=school-api

# --- MySQL ---
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/school_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=school_app
# Password comes from the SCHOOL_DB_PASSWORD environment variable - never hardcoded here.
spring.datasource.password=${SCHOOL_DB_PASSWORD}

# --- JPA / Hibernate ---
# "update" auto-creates and evolves the students table from the entity.
# Use a migration tool (Flyway/Liquibase) instead of this for anything real.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
